<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>حوّل عملتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#EE2A56;
    --pink-dark:#B81C40;
    --blue:#2E7FE8;
    --green:#1FB679;
    --yellow:#FFD54A;
    --ink:#171414;
    --paper:#FFFCF4;
    --grid:rgba(23,20,20,0.055);
    --white:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans Arabic', 'Inter', sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      var(--paper);
    background-size:22px 22px;
    position:relative;
    display:flex;
    flex-direction:column;
    padding-bottom:86px;
    overflow-x:hidden;
  }

  /* ===== HEADER ===== */
  header{
    position:relative;
    background:var(--pink);
    padding:20px 20px 34px;
    clip-path:polygon(0 0,100% 0,100% 82%,0 100%);
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute;
    left:-10%; right:-10%; top:38%;
    height:34%;
    background:var(--blue);
    transform:rotate(-4deg);
    z-index:0;
  }
  .doodle{
    position:absolute;
    font-weight:900;
    color:rgba(255,255,255,0.35);
    z-index:1;
    user-select:none;
  }
  .top-row{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;
  }
  .badge{
    background:#1B4D8A;
    color:#fff;
    font-weight:800;
    font-size:12px;
    padding:6px 14px;
    border-radius:20px;
  }
  .style-toggle{
    background:#fff;
    color:var(--ink);
    border:2px solid var(--ink);
    border-radius:999px;
    padding:6px 12px;
    font-family:'IBM Plex Sans Arabic', 'Inter', sans-serif;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
  }
  .title-stack{ position:relative; z-index:2; margin-top:8px; }
  .title-stack .line{
    display:inline-block;
    font-weight:900;
    font-size:40px;
    line-height:1.02;
    padding:2px 10px;
    margin-bottom:6px;
  }
  .line.l1{ color:var(--ink); background:none; }
  .line.l2{
    color:#fff; background:var(--green);
    transform:rotate(-2.5deg);
    box-shadow:3px 3px 0 rgba(0,0,0,0.15);
  }
  .line.l3{
    display:block; width:fit-content;
    color:#fff; background:var(--blue);
    transform:rotate(1.5deg);
    box-shadow:3px 3px 0 rgba(0,0,0,0.15);
    margin-bottom:10px;
  }
  .ribbon{
    position:relative; z-index:2;
    display:inline-flex; align-items:center; gap:6px;
    background:var(--pink-dark);
    color:#fff; font-weight:800; font-size:16px;
    padding:8px 22px 8px 16px;
    transform:rotate(-2deg);
    margin-top:4px;
  }
  .ribbon::after{
    content:"";
    position:absolute; right:-14px; top:0;
    border-style:solid;
    border-width:0 0 100% 14px;
    border-color:transparent transparent transparent #7f1129;
  }
  .subtitle{
    position:relative; z-index:2;
    color:#fff; font-weight:800; font-size:15px; margin-top:14px;
    line-height:1.5;
    max-width:280px;
  }

  /* ===== SECTION SCROLL AREA ===== */
  main{ padding:18px 16px 10px; flex:1; }
  .section-title{
    font-weight:900; font-size:19px; margin:6px 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title .dash{
    flex:1; height:2px; background:repeating-linear-gradient(90deg,var(--ink) 0 6px, transparent 6px 10px);
    opacity:0.35;
  }

  /* ===== STICKER CARD BASE ===== */
  .card{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:18px;
    box-shadow:5px 5px 0 rgba(23,20,20,0.12);
    padding:16px;
    margin-bottom:16px;
  }

  /* currency tab */
  .row2{ display:flex; gap:10px; }
  .field{ flex:1; }
  label{
    display:block; font-weight:800; font-size:13px; margin-bottom:6px; color:var(--pink-dark);
  }
  select, input[type=number], input[type=text], textarea{
    width:100%;
    font-family:'IBM Plex Sans Arabic', 'Inter', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:11px 12px;
    border:2.5px solid var(--ink);
    border-radius:12px;
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  input[type=number]{
    direction:ltr;
    text-align:left;
    font-family:Arial, sans-serif;
  }
  input[inputmode=decimal]{
    direction:ltr;
    text-align:left;
    font-family:Arial, sans-serif;
  }
  select:focus, input:focus, textarea:focus{ border-color:var(--blue); }
  .swap-btn{
    width:100%;
    margin:12px 0 4px;
    background:var(--yellow);
    border:2.5px solid var(--ink);
    border-radius:12px;
    font-weight:900;
    font-size:14px;
    padding:9px;
    cursor:pointer;
  }
  .rate-row{ margin-top:14px; }
  .rate-panel{
    padding:0;
    overflow:hidden;
  }
  .rate-panel summary{
    list-style:none;
    cursor:pointer;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-weight:900;
  }
  .rate-panel summary::-webkit-details-marker{ display:none; }
  .summary-title{ display:flex; flex-direction:column; gap:3px; }
  .summary-title small{ font-size:12px; color:#555; font-weight:700; }
  .summary-action{
    background:var(--yellow);
    border:2px solid var(--ink);
    border-radius:999px;
    padding:5px 10px;
    font-size:12px;
    white-space:nowrap;
  }
  .rate-panel-body{
    border-top:2.5px dashed var(--ink);
    padding:16px;
  }
  .rate-preview{
    margin-top:12px;
    background:#F3FAFF;
    border:2.5px solid var(--ink);
    border-radius:14px;
    padding:10px 12px;
    font-weight:900;
    line-height:1.6;
  }
  .mini-note{
    margin-top:8px;
    font-size:12px;
    color:#555;
    font-weight:700;
    line-height:1.6;
  }
  .save-btn{
    margin-top:12px;
    width:100%;
    background:var(--green);
    color:#fff;
    border:3px solid var(--ink);
    border-radius:12px;
    font-weight:900;
    font-size:15px;
    padding:12px;
    cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,0.15);
  }
  .save-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,0.15); }

  .active-rate{
    background:var(--blue);
    color:#fff;
    border:3px solid var(--ink);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:16px;
    box-shadow:5px 5px 0 rgba(23,20,20,0.12);
    transform:rotate(-1deg);
  }
  .active-rate .label{ font-size:12px; font-weight:800; opacity:0.85; margin-bottom:4px; }
  .active-rate .value{ font-size:20px; font-weight:900; }

  .convert-card{
    background:var(--pink);
    color:#fff;
    border:3px solid var(--ink);
    border-radius:18px;
    padding:18px 16px;
    box-shadow:5px 5px 0 rgba(23,20,20,0.12);
    margin-bottom:16px;
  }
  .convert-card label{ color:#fff; opacity:0.9; }
  .result{
    margin-top:14px;
    font-size:34px;
    font-weight:900;
    word-break:break-word;
  }
  .result small{ font-size:16px; font-weight:700; opacity:0.85; }
  .unit-result{
    margin-top:10px;
    padding-top:10px;
    border-top:2px dashed rgba(255,255,255,0.55);
    font-size:17px;
    font-weight:900;
    line-height:1.7;
  }
  .unit-result small{ font-size:13px; font-weight:700; opacity:0.85; }
  .banknote-breakdown{
    margin-top:10px;
    padding-top:10px;
    border-top:2px dashed rgba(255,255,255,0.55);
    font-size:13px;
    font-weight:700;
    line-height:1.8;
  }
  .banknote-breakdown .break-title{
    font-size:14px;
    font-weight:900;
    margin-bottom:4px;
  }
  .banknote-breakdown ul{
    margin:4px 0 0;
    padding:0 18px 0 0;
  }
  .direction-toggle{
    width:100%;
    margin:10px 0 12px;
    border:2px solid rgba(255,255,255,0.35);
    border-radius:12px;
    background:rgba(255,255,255,0.12);
    color:#fff;
    padding:9px 12px;
    font-family:'IBM Plex Sans Arabic', 'Inter', sans-serif;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  .pairs-wrap{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .pair-chip{
    background:#fff;
    border:2.5px solid var(--ink);
    border-radius:20px;
    padding:7px 14px;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
  }
  .pair-chip.active{ background:var(--yellow); }

  .rates-table-wrap{
    overflow:hidden;
    border-radius:18px;
    border:3px solid var(--ink);
    background:#fff;
    box-shadow:5px 5px 0 rgba(23,20,20,0.12);
    margin-bottom:16px;
  }
  .rates-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    font-weight:800;
  }
  .rates-table th,
  .rates-table td{
    padding:12px 10px;
    border-bottom:1px solid rgba(23,20,20,0.12);
    text-align:right;
  }
  .rates-table th{
    font-size:11px;
    color:#555;
  }
  .rates-table tr{
    cursor:pointer;
  }
  .rates-table tbody tr:last-child td{ border-bottom:none; }
  .trend{
    direction:ltr;
    display:inline-flex;
    align-items:center;
    gap:4px;
    border-radius:999px;
    padding:4px 8px;
    font-family:Arial, sans-serif;
    font-weight:800;
  }
  .trend.up{ background:rgba(31,182,121,0.14); color:#0B8F5C; }
  .trend.down{ background:rgba(238,42,86,0.14); color:#B81C40; }
  .trend.flat{ background:rgba(100,116,139,0.14); color:#475569; }

  .empty-hint{
    font-size:13px; font-weight:600; color:#555; text-align:center; padding:10px 0;
  }

  /* topics tab */
  .topic-card{ position:relative; }
  .topic-card h3{ margin:0 0 8px; font-size:16px; font-weight:900; }
  .delete-topic-btn{
    position:absolute;
    top:12px;
    left:12px;
    background:var(--pink);
    color:#fff;
    border:2px solid var(--ink);
    border-radius:999px;
    padding:5px 10px;
    font-family:'IBM Plex Sans Arabic', 'Inter', sans-serif;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
  }
  .topic-card .body{ font-size:14px; line-height:1.9; white-space:pre-wrap; color:#2b2b2b; }
  .topic-card .toggle{
    margin-top:10px;
    font-weight:800; font-size:13px; color:var(--blue);
    cursor:pointer; display:inline-block;
  }
  .topic-card .body.collapsed{
    max-height:70px; overflow:hidden; position:relative;
  }
  .topic-card .body.collapsed::after{
    content:"";
    position:absolute; bottom:0; left:0; right:0; height:34px;
    background:linear-gradient(transparent, #fff);
  }
  .tag{
    display:inline-block; font-size:11px; font-weight:800;
    background:var(--yellow); border:2px solid var(--ink);
    border-radius:8px; padding:2px 8px; margin-bottom:8px;
  }

  .add-topic-btn{
    width:100%;
    border:3px dashed var(--ink);
    background:transparent;
    border-radius:18px;
    padding:16px;
    font-weight:900; font-size:15px;
    color:var(--ink);
    cursor:pointer;
    margin-bottom:16px;
  }

  .grocery-summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .grocery-entry-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    align-items:end;
  }
  .grocery-entry-row .field{ min-width:0; }
  .grocery-entry-row label{
    text-align:center;
  }
  .grocery-entry-row input{
    text-align:center;
  }
  .summary-box{
    border:2.5px solid var(--ink);
    border-radius:16px;
    padding:12px;
    background:#fff;
    font-weight:900;
  }
  .summary-box small{
    display:block;
    color:#555;
    font-size:11px;
    margin-bottom:4px;
  }
  .grocery-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid rgba(23,20,20,0.12);
    padding:10px 0;
    font-weight:800;
  }
  .grocery-item:last-child{ border-bottom:none; }
  .grocery-item small{
    display:block;
    color:#555;
    font-size:12px;
    margin-top:2px;
  }
  .grocery-item button{
    border:0;
    background:#FFF1F2;
    color:#BE123C;
    border-radius:999px;
    padding:5px 9px;
    font-weight:900;
    cursor:pointer;
  }

  /* ===== BOTTOM TAB BAR ===== */
  nav.tabbar{
    position:fixed;
    bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:460px;
    background:var(--yellow);
    border-top:3px solid var(--ink);
    display:flex;
    align-items:center;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    gap:4px;
    overflow-x:auto;
    z-index:50;
  }
  .tab-btn{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:transparent; border:none;
    font-family:'IBM Plex Sans Arabic', 'Inter', sans-serif;
    font-weight:800; font-size:11px;
    color:var(--ink);
    padding:6px 10px;
    border-radius:12px;
    cursor:pointer;
    white-space:nowrap;
    flex:0 0 auto;
  }
  .tab-btn .icon{ font-size:19px; }
  .tab-btn.active{ background:#fff; border:2.5px solid var(--ink); }
  .tab-add{
    flex:0 0 auto;
    background:var(--pink);
    color:#fff;
    border:2.5px solid var(--ink);
    width:38px; height:38px;
    border-radius:50%;
    font-size:18px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    margin-inline-start:2px;
  }

  /* ===== MODAL ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(23,20,20,0.55);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .overlay.show{ display:flex; }
  .modal{
    width:100%; max-width:460px;
    background:#fff;
    border-top:4px solid var(--ink);
    border-radius:22px 22px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:80vh;
    overflow-y:auto;
  }
  .modal h2{ margin:0 0 14px; font-size:19px; font-weight:900; }
  .modal .field{ margin-bottom:12px; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; padding:12px; border-radius:12px; border:3px solid var(--ink);
    font-weight:900; font-size:14px; cursor:pointer;
  }
  .btn.primary{ background:var(--green); color:#fff; box-shadow:3px 3px 0 rgba(0,0,0,0.15); }
  .btn.ghost{ background:#fff; color:var(--ink); }
  .emoji-pick{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .emoji-pick span{
    font-size:20px; padding:6px 9px; border:2.5px solid var(--ink); border-radius:10px; cursor:pointer;
  }
  .emoji-pick span.sel{ background:var(--yellow); }

  /* ===== MODERN GLOBAL FINTECH MODE ===== */
  body.simple-body{
    background:
      radial-gradient(circle at 15% 0%, rgba(37,99,235,0.10), transparent 32%),
      radial-gradient(circle at 90% 18%, rgba(16,185,129,0.10), transparent 28%),
      #EEF3F8;
  }
  .app.simple-mode{
    background:#F7FAFC;
    color:#172033;
  }
  .simple-mode header{
    background:
      linear-gradient(135deg, rgba(255,255,255,0.98), rgba(239,246,255,0.96)),
      #fff;
    clip-path:none;
    border-bottom:1px solid #E3EAF3;
    padding:12px 16px 14px;
    border-radius:0 0 18px 18px;
    box-shadow:0 12px 30px rgba(37,99,235,0.08);
  }
  .simple-mode header::before,
  .simple-mode .doodle{ display:none; }
  .simple-mode .badge{
    background:#EAF7F1;
    color:#067647;
    border:1px solid #CFEFDF;
    font-size:11px;
    padding:5px 10px;
  }
  .simple-mode .style-toggle{
    background:#FFFFFF;
    color:#334155;
    border:1px solid #D8E1EC;
    box-shadow:0 6px 18px rgba(15,23,42,0.06);
    font-size:11px;
    padding:5px 10px;
  }
  .simple-mode .title-stack{
    margin-top:8px;
    white-space:nowrap;
  }
  .simple-mode .title-stack br{ display:none; }
  .simple-mode .title-stack .line{
    color:#0F172A;
    background:transparent;
    box-shadow:none;
    transform:none;
    padding:0;
    margin:0;
    font-size:22px;
    line-height:1.2;
    letter-spacing:-0.3px;
    font-weight:700;
  }
  .simple-mode .line.l3{
    display:inline;
    color:#2563EB;
    margin-inline-start:4px;
  }
  .simple-mode .ribbon{
    background:#EFF6FF;
    color:#1D4ED8;
    transform:none;
    box-shadow:none;
    border:1px solid #DBEAFE;
    border-radius:999px;
    padding:4px 10px;
    margin-top:8px;
    font-size:12px;
  }
  .simple-mode .ribbon::after{ display:none; }
  .simple-mode .subtitle{
    color:#64748B;
    max-width:none;
    font-size:12px;
    line-height:1.45;
    margin-top:8px;
  }
  .simple-mode main{ padding:18px 14px 12px; }
  .simple-mode .section-title{
    color:#334155;
    font-size:15px;
    margin:10px 2px 10px;
    font-weight:700;
  }
  .simple-mode .section-title .dash{
    height:1px;
    background:#D7E0EA;
    opacity:1;
  }
  .simple-mode .card,
  .simple-mode .active-rate,
  .simple-mode .convert-card{
    border:1px solid #E2E8F0;
    box-shadow:0 14px 36px rgba(15,23,42,0.08);
    border-radius:22px;
    transform:none;
    background:#FFFFFF;
    color:#172033;
  }
  .simple-mode .convert-card{
    background:linear-gradient(145deg,#1E3A8A,#2563EB);
    color:#fff;
    border-color:#2563EB;
  }
  .simple-mode .convert-card label{ color:#DBEAFE; opacity:1; }
  .simple-mode .direction-toggle{
    border:1px solid rgba(255,255,255,0.28);
    background:rgba(255,255,255,0.14);
  }
  .simple-mode .unit-result{ border-top-color:rgba(255,255,255,0.24); }
  .simple-mode .banknote-breakdown{ border-top-color:rgba(255,255,255,0.24); }
  .simple-mode .active-rate{
    background:#0F172A;
    color:#fff;
  }
  .simple-mode .rate-preview{
    background:#F8FAFC;
    border:1px solid #DDE7F2;
    color:#0F172A;
  }
  .simple-mode select,
  .simple-mode input[type=number],
  .simple-mode input[type=text],
  .simple-mode textarea{
    border:1px solid #D7E0EA;
    border-radius:14px;
    background:#F8FAFC;
    color:#0F172A;
  }
  .simple-mode select option{ background:#FFFFFF; color:#0F172A; }
  .simple-mode .swap-btn,
  .simple-mode .save-btn,
  .simple-mode .btn,
  .simple-mode .pair-chip,
  .simple-mode .tab-btn.active,
  .simple-mode .add-topic-btn{
    border:1px solid #D7E0EA;
    box-shadow:none;
  }
  .simple-mode .save-btn,
  .simple-mode .btn.primary{
    background:#10B981;
    color:#fff;
  }
  .simple-mode .swap-btn,
  .simple-mode .pair-chip.active,
  .simple-mode .summary-action{
    background:#EFF6FF;
    color:#1D4ED8;
  }
  .simple-mode nav.tabbar{
    background:rgba(255,255,255,0.96);
    border-top:1px solid #E2E8F0;
    box-shadow:0 -12px 30px rgba(15,23,42,0.08);
    backdrop-filter:blur(12px);
  }
  .simple-mode .tab-btn{ color:#64748B; }
  .simple-mode .tab-btn.active{
    background:#EFF6FF;
    color:#1D4ED8;
  }
  .simple-mode .tab-add{
    background:#2563EB;
    color:#fff;
    border:1px solid #2563EB;
  }
  .simple-mode .delete-topic-btn{

<script>
/* ---------------- DATA ---------------- */
const CURRENCIES = [
  {c:"USD",s:"$",n:"دولار أمريكي",f:"🇺🇸"},{c:"EUR",s:"€",n:"يورو",f:"🇪🇺"},{c:"GBP",s:"£",n:"جنيه إسترليني",f:"🇬🇧"},
  {c:"JPY",s:"¥",n:"ين ياباني",f:"🇯🇵"},{c:"SAR",s:"﷼",n:"ريال سعودي",f:"🇸🇦"},{c:"AED",s:"د.إ",n:"درهم إماراتي",f:"🇦🇪"},
  {c:"EGP",s:"ج.م",n:"جنيه مصري",f:"🇪🇬"},{c:"KWD",s:"د.ك",n:"دينار كويتي",f:"🇰🇼"},{c:"QAR",s:"ر.ق",n:"ريال قطري",f:"🇶🇦"},
  {c:"BHD",s:"د.ب",n:"دينار بحريني",f:"🇧🇭"},{c:"OMR",s:"ر.ع",n:"ريال عماني",f:"🇴🇲"},{c:"JOD",s:"د.أ",n:"دينار أردني",f:"🇯🇴"},
  {c:"TRY",s:"₺",n:"ليرة تركية",f:"🇹🇷"},{c:"CNY",s:"¥",n:"يوان صيني",f:"🇨🇳"},{c:"INR",s:"₹",n:"روبية هندية",f:"🇮🇳"},
  {c:"CAD",s:"$",n:"دولار كندي",f:"🇨🇦"},{c:"AUD",s:"$",n:"دولار أسترالي",f:"🇦🇺"},{c:"CHF",s:"Fr",n:"فرنك سويسري",f:"🇨🇭"},
  {c:"RUB",s:"₽",n:"روبل روسي",f:"🇷🇺"},{c:"BRL",s:"R$",n:"ريال برازيلي",f:"🇧🇷"},{c:"ZAR",s:"R",n:"راند جنوب أفريقي",f:"🇿🇦"},
  {c:"MAD",s:"د.م",n:"درهم مغربي",f:"🇲🇦"},{c:"TND",s:"د.ت",n:"دينار تونسي",f:"🇹🇳"},{c:"DZD",s:"د.ج",n:"دينار جزائري",f:"🇩🇿"},
  {c:"LBP",s:"ل.ل",n:"ليرة لبنانية",f:"🇱🇧"},{c:"IQD",s:"د.ع",n:"دينار عراقي",f:"🇮🇶"},{c:"PKR",s:"₨",n:"روبية باكستانية",f:"🇵🇰"},
  {c:"IDR",s:"Rp",n:"روبية إندونيسية",f:"🇮🇩"},{c:"MYR",s:"RM",n:"رينغيت ماليزي",f:"🇲🇾"},{c:"THB",s:"฿",n:"بات تايلاندي",f:"🇹🇭"},
  {c:"SGD",s:"$",n:"دولار سنغافوري",f:"🇸🇬"},{c:"KRW",s:"₩",n:"وون كوري جنوبي",f:"🇰🇷"},{c:"NGN",s:"₦",n:"نايرا نيجيرية",f:"🇳🇬"},
  {c:"SEK",s:"kr",n:"كرونة سويدية",f:"🇸🇪"},{c:"NOK",s:"kr",n:"كرونة نرويجية",f:"🇳🇴"},{c:"DKK",s:"kr",n:"كرونة دنماركية",f:"🇩🇰"},
  {c:"PLN",s:"zł",n:"زلوتي بولندي",f:"🇵🇱"},{c:"MXN",s:"$",n:"بيزو مكسيكي",f:"🇲🇽"},{c:"NZD",s:"$",n:"دولار نيوزيلندي",f:"🇳🇿"},
  {c:"HKD",s:"$",n:"دولار هونغ كونغي",f:"🇭🇰"}
];

const DENOMINATIONS = {
  IDR:[100000,50000,20000,10000,5000,2000,1000],
  OMR:[50,20,10,5,1],
  USD:[100,50,20,10,5,1],
  EUR:[500,200,100,50,20,10,5],
  GBP:[50,20,10,5],
  SAR:[500,200,100,50,10,5,1],
  AED:[1000,500,200,100,50,20,10,5],
  KWD:[20,10,5,1],
  QAR:[500,100,50,10,5,1],
  BHD:[20,10,5,1],
  JOD:[50,20,10,5,1],
  TRY:[200,100,50,20,10,5],
  MYR:[100,50,20,10,5,1],
  THB:[1000,500,100,50,20],
  SGD:[100,50,10,5,2],
  CAD:[100,50,20,10,5],
  AUD:[100,50,20,10,5]
};

/* ---------------- STATE ---------------- */
const STORAGE_KEY = "currency-app-state-v6";
const OLD_STORAGE_KEYS = ["currency-app-state-v5", "currency-app-state-v4", "currency-app-state-v3", "currency-app-state-v2"];
let state = loadState();

function defaultState(){
  return {
    activeTab: "currency",
    from: "USD",
    to: "SAR",
    activePair: null,          // {from,to,rate,spent,received}
    pairs: [],                 // saved rate pairs
    amount: "",
    kilos: "",
    convertDirection: "forward",
    groceryItems: [],
    manualSpent: "",
    manualReceived: "",
    ratePanelOpen: true,
    simpleMode: true,
    tabs: [
      {
        id: "guides", name: "أدلة وشروحات", icon: "📘",
        topics: [
          {
            id: "esim1",
            title: "طريقة استخراج eSIM",
            body:
`1) تأكد أن جهازك يدعم eSIM (أغلب الأجهزة الحديثة تدعمها).
2) اشترِ باقة eSIM من مزوّد الخدمة أو المتجر إلكترونيًا.
3) ستصلك رسالة تحتوي على رمز QR أو رابط تفعيل.
4) اذهب إلى: الإعدادات > الشبكة الخلوية > إضافة خطة شبكة.
5) اختر "استخدام رمز QR" وامسح الرمز المرسل إليك.
6) اتبع التعليمات على الشاشة حتى تكتمل عملية التفعيل.
7) فعّل التجوال للبيانات إذا كنت مسافرًا خارج بلدك.`
          }
        ]
      }
    ]
  };
}

function loadState(){
  const base = defaultState();
  try{
    const currentSaved = localStorage.getItem(STORAGE_KEY);
    const oldSaved = OLD_STORAGE_KEYS.map(key => localStorage.getItem(key)).find(Boolean);
    const saved = JSON.parse(currentSaved || oldSaved);
    if(!saved) return base;
    const merged = {
      ...base,
      ...saved,
      pairs: Array.isArray(saved.pairs) ? saved.pairs : [],
      groceryItems: Array.isArray(saved.groceryItems) ? saved.groceryItems : [],
      tabs: Array.isArray(saved.tabs) && saved.tabs.length ? saved.tabs : base.tabs
    };
    if(!currentSaved){
      merged.simpleMode = true;
      merged.convertDirection = "reverse";
    }
    return merged;
  }catch(e){
    return base;
  }
}

function persistState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){}
}

function applyStyleMode(){
  const app = document.querySelector('.app');
  const btn = document.getElementById('styleToggleBtn');
  document.body.classList.toggle('simple-body', !!state.simpleMode);
  if(app) app.classList.toggle('simple-mode', !!state.simpleMode);
  if(btn) btn.textContent = state.simpleMode ? 'النمط الكلاسيكي' : 'النمط الحديث';
}

function toggleSimpleMode(){
  state.simpleMode = !state.simpleMode;
  persistState();
  applyStyleMode();
}

/* ---------------- HELPERS ---------------- */
function cur(code){ return CURRENCIES.find(x=>x.c===code); }
function fmt(n){
  if(!isFinite(n)) return "0";
  return n.toLocaleString('en-US', {maximumFractionDigits:4});
}
function normalizeDigits(value){
  const arabic = "٠١٢٣٤٥٦٧٨٩";
  const persian = "۰۱۲۳۴۵۶۷۸۹";
  return String(value ?? "").replace(/[٠-٩۰-۹]/g, d=>{
    const arabicIndex = arabic.indexOf(d);
    if(arabicIndex >= 0) return String(arabicIndex);
    return String(persian.indexOf(d));
  });
}
function parseNum(value){
  const cleaned = normalizeDigits(value).replace(/,/g,'').replace(/\s/g,'');
  return parseFloat(cleaned);
}
function formatNumberText(value){
  let raw = normalizeDigits(value).replace(/,/g,'').replace(/[^\d.]/g,'');
  if(!raw) return "";
  const dotIndex = raw.indexOf('.');
  if(dotIndex !== -1){
    raw = raw.slice(0, dotIndex + 1) + raw.slice(dotIndex + 1).replace(/\./g,'');
  }
  const hasDot = raw.includes('.');
  const [integerPart, decimalPart = ""] = raw.split('.');
  const formattedInteger = integerPart ? Number(integerPart).toLocaleString('en-US') : "0";
  return hasDot ? `${formattedInteger}.${decimalPart}` : formattedInteger;
}
function wireFormattedNumberInput(input, onChange){
  if(!input) return;
  input.addEventListener('input', ()=>{
    input.value = formatNumberText(input.value);
    onChange(input.value);
  });
}
function currencyLabel(code){
  const x = cur(code);
  return x ? `${x.f} ${x.c}` : code;
}
function currencyOptions(selected){
  return CURRENCIES.map(x=>`<option value="${x.c}" ${x.c===selected?'selected':''}>${x.f} ${x.c} — ${x.n} (${x.s})</option>`).join('');
}
function calculatedRate(){
  const spent = parseNum(state.manualSpent);
  const received = parseNum(state.manualReceived);
  return spent > 0 && received > 0 ? received / spent : null;
}
function ratePreviewText(){
  const rate = calculatedRate();
  return rate ? `1 ${currencyLabel(state.from)} = ${fmt(rate)} ${currencyLabel(state.to)}` : "أدخل ما دفعته وما استلمته لحساب السعر.";
}
function trendClass(pair){
  return pair.trend === "down" ? "down" : pair.trend === "flat" ? "flat" : "up";
}
function trendText(pair){
  const cls = trendClass(pair);
  if(cls === "down") return "▼ down";
  if(cls === "flat") return "• flat";
  return "▲ up";
}
function conversionInputCode(){
  if(!state.activePair) return "";
  return state.convertDirection === "reverse" ? state.activePair.to : state.activePair.from;
}
function conversionOutputCode(){
  if(!state.activePair) return "";
  return state.convertDirection === "reverse" ? state.activePair.from : state.activePair.to;
}
function convertAmountValue(amount){
  if(!state.activePair || !isFinite(amount)) return null;
  return state.convertDirection === "reverse"
    ? amount / state.activePair.rate
    : amount * state.activePair.rate;
}
function denominationsFor(code){
  return DENOMINATIONS[code] || [100,50,20,10,5,1];
}
function banknoteBreakdownHtml(amount, code){
  if(!code || !isFinite(amount) || amount <= 0) return "أدخل المبلغ لعرض عدد الأوراق والفئات.";
  let remaining = Math.floor(amount);
  const parts = [];
  denominationsFor(code).forEach(value=>{
    const count = Math.floor(remaining / value);
    if(count > 0){
      parts.push({value, count});
      remaining -= count * value;
    }
  });
  if(!parts.length) return "المبلغ أصغر من أصغر فئة محفوظة لهذه العملة.";
  const totalNotes = parts.reduce((sum, part)=>sum + part.count, 0);
  const rows = parts.map(part=>`<li>${fmt(part.count)} × فئة ${fmt(part.value)} ${currencyLabel(code)}</li>`).join('');
  const remainder = remaining > 0 ? `<div>متبقي بدون فئة ورقية محفوظة: ${fmt(remaining)} ${currencyLabel(code)}</div>` : '';
  return `<div class="break-title">عدد الأوراق: ${fmt(totalNotes)}</div><ul>${rows}</ul>${remainder}`;
}

/* ---------------- RENDER: TAB BAR ---------------- */
function renderTabBar(){
  const bar = document.getElementById('tabbar');
  let html = `
    <button class="tab-btn ${state.activeTab==='currency'?'active':''}" onclick="switchTab('currency')">
      <span class="icon">💱</span><span>العملات</span>
    </button>
    <button class="tab-btn ${state.activeTab==='grocery'?'active':''}" onclick="switchTab('grocery')">
      <span class="icon">🛒</span><span>البقالة</span>
    </button>`;
  state.tabs.forEach(t=>{
    const canDelete = t.id !== "guides";
    html += `
    <button class="tab-btn ${state.activeTab===t.id?'active':''}"
            onclick="switchTab('${t.id}')"
            ${canDelete ? `ondblclick="deleteCustomTab(event,'${t.id}')" oncontextmenu="deleteCustomTab(event,'${t.id}')" title="اضغط مطولًا أو انقر مرتين للحذف"` : ''}>
      <span class="icon">${t.icon}</span><span>${t.name}</span>
    </button>`;
  });
  html += `<div class="tab-add" onclick="openAddTabModal()">+</div>`;
  bar.innerHTML = html;
}

function switchTab(id){
  state.activeTab = id;
  persistState();
  renderTabBar();
  renderMain();
}

function deleteCustomTab(event, id){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }
  if(id === "currency" || id === "grocery" || id === "guides") return;
  const tab = state.tabs.find(t=>t.id===id);
  if(!tab) return;
  if(!confirm(`حذف تبويب "${tab.name}"؟`)) return;
  state.tabs = state.tabs.filter(t=>t.id !== id);
  if(state.activeTab === id) state.activeTab = "currency";
  persistState();
  renderTabBar();
  renderMain();
}

/* ---------------- RENDER: MAIN ---------------- */
function renderMain(){
  const main = document.getElementById('main');
  if(state.activeTab === 'currency'){
    main.innerHTML = renderCurrencyTab();
    wireCurrencyEvents();
  } else if(state.activeTab === 'grocery'){
    main.innerHTML = renderGroceryTab();
    wireGroceryEvents();
  } else {
    const tab = state.tabs.find(t=>t.id===state.activeTab);
    main.innerHTML = renderTopicsTab(tab);
  }
}

/* ---- currency tab markup ---- */
function renderCurrencyTab(){
  const activeHtml = state.activePair ? `
    <div class="active-rate">
      <div class="label">السعر المستخدم الآن</div>
      <div class="value">1 ${currencyLabel(state.activePair.from)} = ${fmt(state.activePair.rate)} ${currencyLabel(state.activePair.to)}</div>
      ${state.activePair.spent && state.activePair.received ? `<div class="label">من ${fmt(state.activePair.spent)} ${currencyLabel(state.activePair.from)} إلى ${fmt(state.activePair.received)} ${currencyLabel(state.activePair.to)}</div>` : ''}
    </div>` : '';

  const pairsHtml = state.pairs.length ? `
    <div class="rates-table-wrap">
      <table class="rates-table">
        <thead>
          <tr>
            <th>الزوج</th>
            <th>السعر</th>
            <th>الاتجاه</th>
          </tr>
        </thead>
        <tbody>
      ${state.pairs.map((p,i)=>`
          <tr onclick="usePair(${i})">
            <td>${currencyLabel(p.from)} / ${currencyLabel(p.to)}</td>
            <td>1 = ${fmt(p.rate)}</td>
            <td><span class="trend ${trendClass(p)}">${trendText(p)}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : `<div class="empty-hint">ابدأ بإضافة أول سعر صرف فعلي حصلت عليه.</div>`;

  const convertedVal = convertAmountValue(parseNum(state.amount));
  const inputCode = conversionInputCode();
  const outputCode = conversionOutputCode();
  const amountLabel = state.convertDirection === "reverse" ? "المبلغ الذي ستصرفه" : "المبلغ المراد تحويله";
  const resultVal = state.activePair && state.amount !== "" && convertedVal !== null
    ? fmt(convertedVal)
    : "0";
  const kilosVal = parseNum(state.kilos);
  const kiloHtml = state.activePair && state.amount !== "" && convertedVal !== null && kilosVal > 0
    ? `سعر الكيلو الواحد: ${fmt(convertedVal / kilosVal)} <small>${currencyLabel(outputCode)}</small>`
    : `أدخل الكمية لعرض سعر الكيلو الواحد.`;
  const banknoteHtml = banknoteBreakdownHtml(parseNum(state.amount), inputCode);

  return `
    <div class="section-title">اضبط سعر الصرف <span class="dash"></span></div>
    <details class="card rate-panel" id="ratePanel" ${state.ratePanelOpen ? 'open' : ''}>
      <summary>
        <span class="summary-title">
          <span>السعر الفعلي</span>
          <small>${ratePreviewText()}</small>
        </span>
        <span class="summary-action">فتح / طي</span>
      </summary>
      <div class="rate-panel-body">
        <div class="row2">
          <div class="field">
            <label>دفعت بعملة</label>
            <select id="fromSel">${currencyOptions(state.from)}</select>
          </div>
          <div class="field">
            <label>استلمت بعملة</label>
            <select id="toSel">${currencyOptions(state.to)}</select>
          </div>
        </div>
        <button class="swap-btn" id="swapBtn">⇅ عكس العملتين</button>

        <div class="row2 rate-row">
          <div class="field">
            <label id="spentLabel">كم دفعت؟ (${currencyLabel(state.from)})</label>
            <input type="text" inputmode="decimal" id="spentInput" placeholder="مثال: 100" value="${state.manualSpent}">
          </div>
          <div class="field">
            <label id="receivedLabel">كم استلمت؟ (${currencyLabel(state.to)})</label>
            <input type="text" inputmode="decimal" id="receivedInput" placeholder="مثال: 375" value="${state.manualReceived}">
          </div>
        </div>

        <div class="rate-preview" id="ratePreview">${ratePreviewText()}</div>
        <div class="mini-note">احفظ السعر مرة واحدة، ثم استخدمه لتحويل أي مشتريات لاحقًا.</div>
        <button class="save-btn" id="saveRateBtn">احفظ السعر</button>
      </div>
    </details>

    ${activeHtml}

    <div class="section-title">حوّل مبلغًا <span class="dash"></span></div>
    <div class="convert-card">
      <button class="direction-toggle" id="convertDirectionBtn" ${state.activePair?'':'disabled'}>
        ⇄ الاتجاه الحالي: ${state.activePair ? `من ${currencyLabel(inputCode)} إلى ${currencyLabel(outputCode)}` : 'اختر سعرًا أولًا'}
      </button>
      <label>${amountLabel} ${state.activePair ? `(${currencyLabel(inputCode)})` : ''}</label>
      <input type="text" inputmode="decimal" id="amountInput" placeholder="0" value="${state.amount}" ${state.activePair?'':'disabled'}>
      <div class="rate-row">
        <label>الكمية بالكيلو لحساب سعر الوحدة (اختياري)</label>
        <input type="text" inputmode="decimal" id="kiloInput" placeholder="مثال: 5" value="${state.kilos}" ${state.activePair?'':'disabled'}>
      </div>
      <div class="result" id="conversionResult">
        ${resultVal} <small>${state.activePair ? currencyLabel(outputCode) : ''}</small>
      </div>
      <div class="unit-result" id="unitResult">${kiloHtml}</div>
      <div class="banknote-breakdown" id="banknoteBreakdown">${banknoteHtml}</div>
    </div>
  `;
}

function wireCurrencyEvents(){
  const ratePanel = document.getElementById('ratePanel');
  const fromSel = document.getElementById('fromSel');
  const toSel = document.getElementById('toSel');
  const spentInput = document.getElementById('spentInput');
  const receivedInput = document.getElementById('receivedInput');
  const spentLabel = document.getElementById('spentLabel');
  const receivedLabel = document.getElementById('receivedLabel');
  const ratePreview = document.getElementById('ratePreview');
  const swapBtn = document.getElementById('swapBtn');
  const saveBtn = document.getElementById('saveRateBtn');
  const amountInput = document.getElementById('amountInput');
  const kiloInput = document.getElementById('kiloInput');
  const convertDirectionBtn = document.getElementById('convertDirectionBtn');
  const conversionResult = document.getElementById('conversionResult');
  const unitResult = document.getElementById('unitResult');
  const banknoteBreakdown = document.getElementById('banknoteBreakdown');

  function updateRateUi(){
    spentLabel.textContent = `كم دفعت؟ (${currencyLabel(fromSel.value)})`;
    receivedLabel.textContent = `كم استلمت؟ (${currencyLabel(toSel.value)})`;
    ratePreview.textContent = ratePreviewText();
  }

  function updateConversionResult(){
    if(!conversionResult) return;
    const amount = parseNum(state.amount);
    const kilos = parseNum(state.kilos);
    const converted = convertAmountValue(amount);
    const outputCode = conversionOutputCode();
    const resultVal = state.activePair && state.amount !== "" && converted !== null
      ? fmt(converted)
      : "0";
    conversionResult.innerHTML = `${resultVal} <small>${state.activePair ? currencyLabel(outputCode) : ''}</small>`;
    if(unitResult){
      unitResult.innerHTML = state.activePair && state.amount !== "" && converted !== null && kilos > 0
        ? `سعر الكيلو الواحد: ${fmt(converted / kilos)} <small>${currencyLabel(outputCode)}</small>`
        : "أدخل الكمية لعرض سعر الكيلو الواحد.";
    }
    if(banknoteBreakdown){
      banknoteBreakdown.innerHTML = banknoteBreakdownHtml(amount, conversionInputCode());
    }
  }

  ratePanel.addEventListener('toggle', ()=>{
    state.ratePanelOpen = ratePanel.open;
    persistState();
  });

  fromSel.addEventListener('change', ()=>{
    state.from = fromSel.value;
    updateRateUi();
    persistState();
  });
  toSel.addEventListener('change', ()=>{
    state.to = toSel.value;
    updateRateUi();
    persistState();
  });

  wireFormattedNumberInput(spentInput, value=>{
    state.manualSpent = value;
    updateRateUi();
    persistState();
  });
  wireFormattedNumberInput(receivedInput, value=>{
    state.manualReceived = value;
    updateRateUi();
    persistState();
  });

  swapBtn.addEventListener('click', ()=>{
    const f = fromSel.value, t = toSel.value;
    const spent = state.manualSpent, received = state.manualReceived;
    state.from = t; state.to = f;
    state.manualSpent = received;
    state.manualReceived = spent;
    const spentNum = parseNum(spent);
    const receivedNum = parseNum(received);
    if(state.activePair && state.activePair.from === f && state.activePair.to === t && state.activePair.rate > 0){
      state.activePair = {
        from: t,
        to: f,
        rate: 1 / state.activePair.rate,
        spent: state.activePair.received,
        received: state.activePair.spent,
        updatedAt: Date.now()
      };
    }else if(spentNum > 0 && receivedNum > 0){
      state.activePair = {
        from: t,
        to: f,
        rate: spentNum / receivedNum,
        spent: receivedNum,
        received: spentNum,
        updatedAt: Date.now()
      };
    }
    persistState();
    renderMain();
  });

  saveBtn.addEventListener('click', ()=>{
    const spent = parseNum(spentInput.value);
    const received = parseNum(receivedInput.value);
    if(!spent || spent <= 0 || !received || received <= 0){
      if(!spent || spent <= 0) spentInput.style.borderColor = 'var(--pink)';
      if(!received || received <= 0) receivedInput.style.borderColor = 'var(--pink)';
      return;
    }
    const oldPair = state.pairs.find(p=>p.from===fromSel.value && p.to===toSel.value);
    const newRate = received / spent;
    const pair = {
      from: fromSel.value,
      to: toSel.value,
      rate: newRate,
      spent,
      received,
      trend: oldPair ? (newRate > oldPair.rate ? "up" : newRate < oldPair.rate ? "down" : "flat") : "up",
      updatedAt: Date.now()
    };
    state.pairs = state.pairs.filter(p=>!(p.from===pair.from && p.to===pair.to));
    state.pairs.unshift(pair);
    state.activePair = pair;
    state.amount = "";
    state.convertDirection = "reverse";
    state.ratePanelOpen = false;
    persistState();
    renderMain();
  });

  if(amountInput){
    wireFormattedNumberInput(amountInput, value=>{
      state.amount = value;
      persistState();
      updateConversionResult();
    });
  }
  if(kiloInput){
    wireFormattedNumberInput(kiloInput, value=>{
      state.kilos = value;
      persistState();
      updateConversionResult();
    });
  }
  if(convertDirectionBtn){
    convertDirectionBtn.addEventListener('click', ()=>{
      state.convertDirection = state.convertDirection === "reverse" ? "forward" : "reverse";
      persistState();
      renderMain();
    });
  }
}

function usePair(i){
  state.activePair = state.pairs[i];
  state.from = state.activePair.from;
  state.to = state.activePair.to;
  state.manualSpent = state.activePair.spent ? String(state.activePair.spent) : "1";
  state.manualReceived = state.activePair.received ? String(state.activePair.received) : String(state.activePair.rate);
  state.ratePanelOpen = true;
  state.convertDirection = "reverse";
  state.amount = "";
  persistState();
  renderMain();
}

/* ---- grocery tab markup ---- */
function renderGroceryTab(){
  const hasRate = !!state.activePair;
  const inputCode = conversionInputCode();
  const outputCode = conversionOutputCode();
  const totalInput = state.groceryItems.reduce((sum,item)=>sum + (parseNum(item.amount) || 0), 0);
  const totalOutput = state.groceryItems.reduce((sum,item)=>{
    const converted = convertAmountValue(parseNum(item.amount));
    return sum + (converted || 0);
  }, 0);
  const groceryBanknotes = banknoteBreakdownHtml(totalInput, inputCode);

  const itemsHtml = state.groceryItems.length ? state.groceryItems.map(item=>{
    const amount = parseNum(item.amount) || 0;
    const kilos = parseNum(item.kilos) || 0;
    const converted = convertAmountValue(amount) || 0;
    const kiloLine = kilos > 0
      ? `<small>سعر الكيلو: ${fmt(amount / kilos)} ${currencyLabel(inputCode)} = ${fmt(converted / kilos)} ${currencyLabel(outputCode)}</small>`
      : '';
    return `
      <div class="grocery-item">
        <div>
          <div>${escapeHtml(item.name || 'مشتريات')}</div>
          <small>${fmt(amount)} ${currencyLabel(inputCode)} = ${fmt(converted)} ${currencyLabel(outputCode)}</small>
          ${kiloLine}
        </div>
        <button onclick="removeGroceryItem('${item.id}')">حذف</button>
      </div>`;
  }).join('') : `<div class="empty-hint">أضف مبالغ مشترياتك هنا، وسيظهر المجموع بالعملتين.</div>`;

  return `
    <div class="section-title">🛒 البقالة <span class="dash"></span></div>
    ${hasRate ? `
      <div class="grocery-summary">
        <div class="summary-box">
          <small>المجموع بعملة الصرف</small>
          ${fmt(totalInput)} ${currencyLabel(inputCode)}
        </div>
        <div class="summary-box">
          <small>المجموع بالعملة الأصلية</small>
          ${fmt(totalOutput)} ${currencyLabel(outputCode)}
        </div>
      </div>
    ` : `<div class="empty-hint">احفظ سعر الصرف أولًا من تبويب العملات.</div>`}

    <div class="card">
      <div class="grocery-entry-row">
        <div class="field">
          <label>الصنف</label>
          <input type="text" id="groceryName" placeholder="مثال: لحم" ${hasRate?'':'disabled'}>
        </div>
        <div class="field">
          <label>المبلغ ${hasRate ? `(${currencyLabel(inputCode)})` : ''}</label>
          <input type="text" inputmode="decimal" id="groceryAmount" placeholder="0" ${hasRate?'':'disabled'}>
        </div>
        <div class="field">
          <label>كيلو</label>
          <input type="text" inputmode="decimal" id="groceryKilos" placeholder="0" ${hasRate?'':'disabled'}>
        </div>
      </div>
      <button class="save-btn" id="addGroceryBtn" ${hasRate?'':'disabled'}>أضف إلى البقالة</button>
    </div>

    <div class="card">
      ${itemsHtml}
    </div>

    ${hasRate ? `<div class="card">
      <div class="banknote-breakdown">${groceryBanknotes}</div>
    </div>` : ''}
  `;
}

function wireGroceryEvents(){
  const addBtn = document.getElementById('addGroceryBtn');
  if(!addBtn) return;
  const groceryAmountInput = document.getElementById('groceryAmount');
  const groceryKilosInput = document.getElementById('groceryKilos');
  wireFormattedNumberInput(groceryAmountInput, ()=>{});
  wireFormattedNumberInput(groceryKilosInput, ()=>{});
  addBtn.addEventListener('click', ()=>{
    const nameInput = document.getElementById('groceryName');
    const amountInput = document.getElementById('groceryAmount');
    const kilosInput = document.getElementById('groceryKilos');
    const amount = parseNum(amountInput.value);
    if(!amount || amount <= 0){
      amountInput.style.borderColor = 'var(--pink)';
      return;
    }
    state.groceryItems.unshift({
      id:'g_' + Date.now(),
      name:nameInput.value.trim(),
      amount,
      kilos: parseNum(kilosInput.value) || ""
    });
    persistState();
    renderMain();
  });
}

function removeGroceryItem(id){
  state.groceryItems = state.groceryItems.filter(item=>item.id !== id);
  persistState();
  renderMain();
}

/* ---- topics tab markup ---- */
function renderTopicsTab(tab){
  if(!tab) return '';
  const cards = tab.topics.map(t=>`
    <div class="card topic-card">
      <button class="delete-topic-btn" onclick="deleteTopic('${tab.id}','${t.id}')">حذف</button>
      <div class="tag">${tab.name}</div>
      <h3>${t.title}</h3>
      <div class="body collapsed" id="body-${t.id}">${escapeHtml(t.body)}</div>
      <span class="toggle" onclick="toggleTopic('${t.id}')">عرض المزيد ▾</span>
    </div>
  `).join('') || `<div class="empty-hint">لا توجد مواضيع بعد في هذا التبويب</div>`;

  return `
    <div class="section-title">${tab.icon} ${tab.name} <span class="dash"></span></div>
    ${cards}
    <button class="add-topic-btn" onclick="openAddTopicModal('${tab.id}')">＋ أضف موضوعًا جديدًا في هذا التبويب</button>
  `;
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function toggleTopic(id){
  const el = document.getElementById('body-'+id);
  const toggleEl = el.nextElementSibling;
  const collapsed = el.classList.toggle('collapsed');
  toggleEl.textContent = collapsed ? 'عرض المزيد ▾' : 'إخفاء ▴';
}

function deleteTopic(tabId, topicId){
  const tab = state.tabs.find(t=>t.id===tabId);
  if(!tab) return;
  if(!confirm('هل تريد حذف هذا الموضوع؟')) return;
  tab.topics = tab.topics.filter(t=>t.id !== topicId);
  persistState();
  renderMain();
}

/* ---------------- MODALS ---------------- */
function openOverlay(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closeOverlay();
});

function openAddTabModal(){
  const emojis = ['📘','✈️','🎓','🍽️','🏦','📱','🛒','🚕','🩺','🏨'];
  openOverlay(`
    <h2>تبويب جديد</h2>
    <div class="field">
      <label>اسم التبويب</label>
      <input type="text" id="newTabName" placeholder="مثال: السفر والتنقل">
    </div>
    <div class="field">
      <label>اختر أيقونة</label>
      <div class="emoji-pick" id="emojiPick">
        ${emojis.map((e,i)=>`<span data-e="${e}" class="${i===0?'sel':''}">${e}</span>`).join('')}
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeOverlay()">إلغاء</button>
      <button class="btn primary" onclick="confirmAddTab()">إضافة</button>
    </div>
  `);
  document.getElementById('emojiPick').addEventListener('click', (e)=>{
    if(e.target.tagName==='SPAN'){
      document.querySelectorAll('#emojiPick span').forEach(s=>s.classList.remove('sel'));
      e.target.classList.add('sel');
    }
  });
}

function confirmAddTab(){
  const name = document.getElementById('newTabName').value.trim();
  const emojiEl = document.querySelector('#emojiPick span.sel');
  if(!name){ document.getElementById('newTabName').style.borderColor='var(--pink)'; return; }
  const id = 'tab_' + Date.now();
  state.tabs.push({id, name, icon: emojiEl ? emojiEl.dataset.e : '📘', topics: []});
  state.activeTab = id;
  persistState();
  closeOverlay();
  renderTabBar();
  renderMain();
}

function openAddTopicModal(tabId){
  openOverlay(`
    <h2>موضوع جديد</h2>
    <div class="field">
      <label>عنوان الموضوع</label>
      <input type="text" id="newTopicTitle" placeholder="مثال: كيفية حجز موعد التأشيرة">
    </div>
    <div class="field">
      <label>التفاصيل</label>
      <textarea id="newTopicBody" rows="6" placeholder="اكتب الخطوات أو التفاصيل هنا..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeOverlay()">إلغاء</button>
      <button class="btn primary" onclick="confirmAddTopic('${tabId}')">إضافة</button>
    </div>
  `);
}

function confirmAddTopic(tabId){
  const title = document.getElementById('newTopicTitle').value.trim();
  const body = document.getElementById('newTopicBody').value.trim();
  if(!title || !body){
    if(!title) document.getElementById('newTopicTitle').style.borderColor='var(--pink)';
    if(!body) document.getElementById('newTopicBody').style.borderColor='var(--pink)';
    return;
  }
  const tab = state.tabs.find(t=>t.id===tabId);
  tab.topics.unshift({id:'t_'+Date.now(), title, body});
  persistState();
  closeOverlay();
  renderMain();
}

/* ---------------- INIT ---------------- */
applyStyleMode();
renderTabBar();
renderMain();
</script>
